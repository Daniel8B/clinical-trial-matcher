services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trials
      POSTGRES_PASSWORD: trials
      POSTGRES_DB: trials
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: